spring.application.name=loan-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:loandb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j Circuit Breaker Config for memberService
resilience4j.circuitbreaker.instances.memberService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.memberService.sliding-window-size=10
resilience4j.circuitbreaker.instances.memberService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.memberService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.memberService.permitted-number-of-calls-in-half-open-state=3
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

#sliding-window-size tells Resilience4j to only look at the outcome of the last 10 calls to calculate the failure rate.